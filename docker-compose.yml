services:
  tekken-bot:
    build: .
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/battles.db
      - LOG_PATH=/app/data/tekken_bot.log
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Tokyo
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3,os; sqlite3.connect(os.environ.get('DB_PATH','data/battles.db')).close()"]
      interval: 1h
      timeout: 10s
      retries: 2

  tekken-exporter:
    build: .
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/battles.db
      - LOG_PATH=/app/data/tekken_bot.log
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Tokyo
    env_file:
      - .env
    command: python exporter.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9877/metrics', timeout=5)"]
      interval: 1h
      timeout: 10s
      retries: 2

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.listen-address=0.0.0.0:9090

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SERVER_HTTP_PORT=3000
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - TZ=Asia/Tokyo
      # アラート通知先 Discord Webhook。.env に DISCORD_ALERT_WEBHOOK=... を定義する。
      # 未設定なら空文字となり、コンタクトポイントは送信先なしで起動する（致命的エラーにはならない）。
      - DISCORD_ALERT_WEBHOOK=${DISCORD_ALERT_WEBHOOK:-}

volumes:
  prometheus_data:
  grafana_data:
