[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["discord.*", "bs4.*"]
ignore_errors = true

# bot.graph は全面的に matplotlib 描画グルー。matplotlib のスタブはバージョン毎に
# 厳格度が変わり（datetime を ArrayLike と認めない等）誤検出を生むため、
# 上の matplotlib.* opt-out をこのモジュールにも延長する。
[[tool.mypy.overrides]]
module = ["bot.graph"]
ignore_errors = true

[tool.pytest.ini_options]
# テスト環境に CJK フォント（Noto Sans CJK JP）が無いため、グラフの日本語タイトル
# 描画で matplotlib が「Glyph ... missing from font」を多発させる。本番コンテナには
# フォントが入る純粋な環境差なので、この警告だけを抑制して CI ログを読みやすく保つ。
filterwarnings = [
    "ignore:Glyph .* missing from font.*:UserWarning",
]
