name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Type check (mypy)
        run: python -m mypy bot main.py exporter.py scheduler.py

      - name: Run tests with coverage
        run: python -m pytest tests/ -q --cov=bot --cov=main --cov-fail-under=90
